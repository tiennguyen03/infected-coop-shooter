<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#24272c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#be9646" stroke-width="6"/>

  <!-- magazine, slightly tilted -->
  <g transform="rotate(-12 110 140)">
    <path d="M86 64 L142 64 L150 196 Q150 210 136 210 L100 210 Q86 210 84 196 Z"
          fill="url(#mag)" stroke="#15171a" stroke-width="5" stroke-linejoin="round"/>
    <!-- feed lip + top round -->
    <rect x="84" y="56" width="60" height="14" rx="4" fill="#4a4f56"/>
    <path d="M96 56 Q96 40 114 36 Q132 40 132 56 Z" fill="#be9646"/>
    <!-- witness holes -->
    <g fill="#15171a"><circle cx="138" cy="100" r="4"/><circle cx="140" cy="130" r="4"/><circle cx="142" cy="160" r="4"/></g>
  </g>

  <!-- flying shrapnel fragments -->
  <g fill="#d9b35e" stroke="#8f6e2a" stroke-width="2">
    <path d="M178 70 l16 6 l-6 14 l-14 -8 Z"/>
    <path d="M196 110 l14 10 l-10 12 l-12 -10 Z"/>
    <path d="M176 132 l12 4 l-4 12 l-12 -6 Z"/>
  </g>
  <g stroke="#be9646" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="160" y1="74" x2="176" y2="70"/>
    <line x1="170" y1="118" x2="188" y2="116"/>
  </g>
</svg>
