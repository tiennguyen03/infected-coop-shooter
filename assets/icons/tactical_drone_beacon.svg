<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55606a"/>
      <stop offset="1" stop-color="#333b42"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#3fa7d6" stroke-width="6"/>

  <!-- radio waves -->
  <g fill="none" stroke="#3fa7d6" stroke-width="7" stroke-linecap="round">
    <path d="M84 96 A62 62 0 0 1 172 96" opacity="0.35"/>
    <path d="M96 110 A44 44 0 0 1 160 110" opacity="0.6"/>
    <path d="M109 124 A26 26 0 0 1 147 124"/>
  </g>

  <!-- drone silhouette -->
  <g fill="#9fd8f0">
    <rect x="116" y="52" width="24" height="12" rx="5"/>
    <rect x="92" y="55" width="22" height="5" rx="2.5"/>
    <rect x="142" y="55" width="22" height="5" rx="2.5"/>
    <circle cx="96" cy="50" r="4"/>
    <circle cx="160" cy="50" r="4"/>
    <rect x="78" y="48" width="36" height="4" rx="2"/>
    <rect x="142" y="48" width="36" height="4" rx="2"/>
  </g>

  <!-- beacon body -->
  <g>
    <rect x="86" y="140" width="84" height="64" rx="10" fill="url(#metal)" stroke="#6b7680" stroke-width="3"/>
    <!-- antenna -->
    <rect x="124" y="104" width="8" height="40" rx="4" fill="#6b7680"/>
    <circle cx="128" cy="100" r="9" fill="#3fa7d6"/>
    <!-- status lights -->
    <circle cx="104" cy="160" r="7" fill="#46d68c"/>
    <circle cx="128" cy="160" r="7" fill="#3fa7d6"/>
    <circle cx="152" cy="160" r="7" fill="#2a3138"/>
    <!-- speaker grille -->
    <g stroke="#262a2e" stroke-width="4" stroke-linecap="round">
      <line x1="100" y1="180" x2="156" y2="180"/>
      <line x1="100" y1="190" x2="156" y2="190"/>
    </g>
  </g>

  <!-- base feet -->
  <rect x="78" y="204" width="100" height="12" rx="6" fill="#2a3138"/>
</svg>
