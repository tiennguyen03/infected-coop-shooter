<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8fd0"/>
      <stop offset="1" stop-color="#34568a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#4e84c4" stroke-width="6"/>

  <!-- plate carrier body -->
  <path d="M128 42 L198 66 Q202 152 128 214 Q54 152 58 66 Z"
        fill="url(#plate)" stroke="#27406a" stroke-width="6" stroke-linejoin="round"/>
  <!-- center armor plate -->
  <rect x="98" y="90" width="60" height="78" rx="8" fill="#cdd9ea" opacity="0.92"/>
  <rect x="98" y="90" width="60" height="78" rx="8" fill="none" stroke="#27406a" stroke-width="4"/>
  <line x1="128" y1="90" x2="128" y2="168" stroke="#27406a" stroke-width="3" opacity="0.5"/>
  <line x1="98" y1="129" x2="158" y2="129" stroke="#27406a" stroke-width="3" opacity="0.5"/>
  <!-- straps / rivets -->
  <g fill="#27406a">
    <circle cx="80" cy="78" r="5"/>
    <circle cx="176" cy="78" r="5"/>
    <circle cx="128" cy="198" r="5"/>
  </g>
</svg>
