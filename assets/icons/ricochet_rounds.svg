<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b85c"/>
      <stop offset="1" stop-color="#8f6e2a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#78c8d2" stroke-width="6"/>

  <!-- bounce path -->
  <path d="M44 196 L108 120 L150 156 L212 70" fill="none" stroke="#78c8d2"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16"/>
  <!-- impact point -->
  <circle cx="108" cy="120" r="9" fill="none" stroke="#78c8d2" stroke-width="5" opacity="0.8"/>
  <circle cx="150" cy="156" r="7" fill="none" stroke="#78c8d2" stroke-width="4" opacity="0.6"/>

  <!-- bullet flying toward upper-right -->
  <g transform="translate(212,70) rotate(-50)">
    <path d="M0 -16 Q22 -16 36 0 Q22 16 0 16 Z" fill="#c3d9dd"/>
    <rect x="-34" y="-16" width="34" height="32" rx="4" fill="url(#brass)"/>
    <rect x="-40" y="-16" width="8" height="32" rx="2" fill="#8f6e2a"/>
    <rect x="-26" y="-9" width="22" height="5" fill="#f0d490" opacity="0.5"/>
  </g>
</svg>
