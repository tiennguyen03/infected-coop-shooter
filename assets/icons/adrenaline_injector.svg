<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="fluid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ef0a8"/>
      <stop offset="1" stop-color="#2bb86d"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#46d68c" stroke-width="6"/>

  <!-- glow behind syringe -->
  <circle cx="128" cy="128" r="64" fill="#46d68c" opacity="0.12"/>

  <!-- syringe at 45 degrees -->
  <g transform="rotate(45 128 128)">
    <!-- needle -->
    <rect x="128" y="30" width="4" height="34" fill="#cfd6dd"/>
    <path d="M130 22 L127 34 L133 34 Z" fill="#cfd6dd"/>
    <!-- needle hub -->
    <rect x="118" y="62" width="24" height="12" rx="3" fill="#9aa4ad"/>
    <!-- barrel -->
    <rect x="106" y="74" width="48" height="92" rx="8" fill="#3a4148" stroke="#9aa4ad" stroke-width="3"/>
    <!-- fluid window -->
    <rect x="114" y="84" width="32" height="72" rx="5" fill="url(#fluid)"/>
    <rect x="119" y="88" width="7" height="62" fill="#b9ffd9" opacity="0.55"/>
    <!-- graduation marks -->
    <g stroke="#17191c" stroke-width="3" opacity="0.6">
      <line x1="114" y1="100" x2="130" y2="100"/>
      <line x1="114" y1="118" x2="126" y2="118"/>
      <line x1="114" y1="136" x2="130" y2="136"/>
    </g>
    <!-- flange + plunger -->
    <rect x="96" y="166" width="68" height="10" rx="4" fill="#9aa4ad"/>
    <rect x="122" y="176" width="16" height="34" fill="#7d8893"/>
    <rect x="112" y="210" width="36" height="12" rx="5" fill="#c43a2c"/>
  </g>

  <!-- heartbeat spark -->
  <path d="M52 196 L78 196 L88 176 L100 212 L110 192 L126 192" fill="none"
        stroke="#6ef0a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
