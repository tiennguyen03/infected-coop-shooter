<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a4754"/>
      <stop offset="1" stop-color="#1d242b"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#dc3c3c" stroke-width="6"/>

  <!-- scope body ring -->
  <circle cx="128" cy="128" r="78" fill="url(#lens)" stroke="#454d55" stroke-width="10"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="#2a3036" stroke-width="4"/>

  <!-- crosshair -->
  <g stroke="#dc3c3c" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="58" x2="128" y2="104"/>
    <line x1="128" y1="152" x2="128" y2="198"/>
    <line x1="58" y1="128" x2="104" y2="128"/>
    <line x1="152" y1="128" x2="198" y2="128"/>
  </g>
  <!-- mil-dots -->
  <g fill="#dc3c3c">
    <circle cx="128" cy="92" r="3.5"/>
    <circle cx="128" cy="164" r="3.5"/>
    <circle cx="92" cy="128" r="3.5"/>
    <circle cx="164" cy="128" r="3.5"/>
  </g>
  <!-- center mark -->
  <circle cx="128" cy="128" r="9" fill="none" stroke="#dc3c3c" stroke-width="4"/>
  <circle cx="128" cy="128" r="3" fill="#ff6a6a"/>
  <!-- lens glint -->
  <path d="M96 100 q22 -18 52 -10" fill="none" stroke="#7a8893" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
</svg>
