<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a2e"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa4ad"/>
      <stop offset="1" stop-color="#5b636b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="28" fill="url(#bg)" stroke="#78b4ff" stroke-width="6"/>

  <!-- coil base -->
  <rect x="92" y="186" width="72" height="20" rx="6" fill="#3a3e44" stroke="#15171a" stroke-width="4"/>
  <!-- coil windings -->
  <g fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round">
    <path d="M104 186 q24 -16 48 0"/>
    <path d="M104 168 q24 -16 48 0"/>
    <path d="M104 150 q24 -16 48 0"/>
    <path d="M104 132 q24 -16 48 0"/>
  </g>
  <!-- emitter sphere -->
  <circle cx="128" cy="100" r="22" fill="#cfe2ff"/>
  <circle cx="128" cy="100" r="22" fill="none" stroke="#78b4ff" stroke-width="4"/>

  <!-- lightning arcs -->
  <g fill="#bfe0ff" stroke="#78b4ff" stroke-width="2">
    <path d="M128 78 L150 44 L138 46 L160 16 L120 50 L132 48 Z"/>
    <path d="M110 92 L78 78 L88 90 L60 88 L96 110 L88 98 Z"/>
    <path d="M148 100 L186 96 L174 106 L200 116 L160 120 L170 110 Z"/>
  </g>
</svg>
