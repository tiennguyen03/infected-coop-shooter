# Static checks and tests on every push (docs/ARCHITECTURE.md F5): the CLAUDE.md static
# checks, the Lune tests and the luau-lsp type check. Tool versions come from rokit.toml.
name: Checks

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tools are downloaded once per rokit.toml change, so a GitHub release outage
      # does not fail the checks.
      - name: Cache tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tools-${{ runner.os }}-${{ hashFiles('rokit.toml', 'scripts/install-tools.sh') }}

      - name: Install tools (versions from rokit.toml)
        if: steps.tools.outputs.cache-hit != 'true'
        run: bash scripts/install-tools.sh "$HOME/.local/bin"

      - name: Put tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format (StyLua)
        run: stylua --check src tests

      - name: Lint (Selene)
        run: selene src

      - name: Build (Rojo)
        run: rojo build default.project.json -o build.rbxlx

      - name: Tests (Lune)
        run: lune run tests/run

      - name: Type check (luau-lsp)
        run: |
          v=$(sed -n 's/^luau-lsp = "[^@]*@\(.*\)"$/\1/p' rokit.toml)
          base=https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/$v/scripts
          curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors -o globalTypes.d.luau "$base/globalTypes.d.luau"
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau src
